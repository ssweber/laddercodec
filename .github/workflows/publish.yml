name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout (official GitHub action)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv (official Astral action)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.8"
          enable-cache: auto
          python-version: "3.12"

      - name: Set up Python (using uv)
        run: uv python install

      - name: Check that the commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Build package
        run: uv build

      - name: Check the built wheel
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          uv venv --no-project "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel" dist/*.whl
          "$RUNNER_TEMP/wheel/bin/python" -I -c 'import os, importlib.metadata as m, laddercodec; tag = os.environ["TAG"].removeprefix("v"); v = m.version("laddercodec"); print(v); assert not tag or v == tag, (v, tag)'

      - name: Publish to PyPI (using uv)
        uses: pypa/gh-action-pypi-publish@release/v1

  docs:
    name: Deploy the release's docs
    # A pre-release goes to PyPI but leaves the public docs on the last full release.
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Deploy docs from the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh workflow run docs.yml --ref main -f ref="$TAG"
