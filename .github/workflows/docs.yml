name: Docs

# The public site describes the latest release, not main. Pull requests build it
# (no deploy). A deploy is a workflow_dispatch on main: publish.yml starts one with
# the release's tag after the PyPI upload; by hand, `ref` defaults to the latest release.
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to build (default: the latest release)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Choose the release to build
        id: source
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          if [ -z "$REF" ]; then
            REF=$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)
          fi
          echo "Building $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.8"
          enable-cache: auto
          python-version: "3.12"

      - name: Set up Python
        run: uv python install

      - name: Install docs dependencies
        run: uv sync --locked --group docs

      - name: Cache-bust extra assets
        run: |
          sha=$(git rev-parse --short=8 HEAD)
          sed -i -E "s#^(\s*- (stylesheets|javascripts)/[^?[:space:]]+)\$#\1?v=${sha}#" mkdocs.yml
          grep -E '\?v=' mkdocs.yml

      - name: Build docs
        run: make docs-check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    # On the deploy only: at workflow level, a pull request build queued behind a
    # waiting deploy would replace it.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
